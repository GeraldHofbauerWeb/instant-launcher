name: Build and Release

on:
  push:
    branches: [ main, master ]
    tags: [ 'v*' ]
  pull_request:
    branches: [ main, master ]

permissions:
  contents: write
  packages: write
  actions: read

# Two notes on the versions below, because both were chosen rather than
# inherited.
#
# The actions are on their Node 24 majors. GitHub is retiring the Node 20
# runtime, and until this bump every run carried a deprecation warning saying
# the old actions were being forced onto Node 24 anyway — running on an engine
# they were never tested against is worse than naming it. The majors need a
# runner of at least v2.327.1, which every GitHub-hosted runner is well past.
#
# The runners are pinned to a numbered Ubuntu, not ubuntu-latest, which
# migrates to Ubuntu 26 from 19 October 2026. A release pipeline is the wrong
# place to find out what a distribution upgrade changed, and there is a
# specific reason to expect it to: libgles2-mesa-dev and libegl1-mesa-dev,
# which the Gio build needs below, are already transitional packages on 24.04
# and may simply be gone on 26. Moving up is then its own change, made
# deliberately and watched, rather than something that happens to the next tag
# pushed after a Sunday in October.

jobs:
  test:
    runs-on: ubuntu-24.04
    steps:
    - uses: actions/checkout@v7

    - name: Set up Go
      uses: actions/setup-go@v7
      with:
        # Follow go.mod rather than pinning a version here; the repo already
        # uses language features newer than the version this used to name.
        go-version-file: go.mod

    # The GUI package needs Gio's headers to compile. Everything the launcher
    # decides lives in internal/launcher, which has no such dependency, but
    # ./... still has to build.
    - name: Install Gio build dependencies
      run: |
        # The runner image ships a Google Chrome apt source that breaks
        # apt-get update whenever Google's index is mid-rollover. Nothing
        # here needs it.
        sudo rm -f /etc/apt/sources.list.d/*google* /etc/apt/sources.list.d/*chrome*
        # A third-party index that still fails must not block the Ubuntu
        # packages this actually installs.
        sudo apt-get update || true
        sudo apt-get install -y --no-install-recommends \
          gcc pkg-config libwayland-dev libx11-dev libx11-xcb-dev \
          libxkbcommon-x11-dev libgles2-mesa-dev libegl1-mesa-dev \
          libxcursor-dev libxrandr-dev libxinerama-dev libxi-dev \
          libxxf86vm-dev libvulkan-dev wayland-protocols xorg-dev

    # No display is available here, and none is needed: a test that wants one
    # means the layering has been violated.
    - name: Test
      run: go test -race ./...

    - name: Vet
      run: go vet ./...

    - name: Check formatting
      run: test -z "$(gofmt -l .)" || (gofmt -l . && exit 1)

  # The CLI keeps its original build story: every target cross-compiled from a
  # single Linux host with cgo disabled.
  build-cli:
    needs: test
    runs-on: ubuntu-24.04
    env:
      CGO_ENABLED: 0
    strategy:
      matrix:
        os: [linux, windows, darwin]
        arch: [amd64, arm64]
        exclude:
          - os: windows
            arch: arm64

    steps:
    - uses: actions/checkout@v7

    - name: Set up Go
      uses: actions/setup-go@v7
      with:
        go-version-file: go.mod

    - name: Build binary
      env:
        GOOS: ${{ matrix.os }}
        GOARCH: ${{ matrix.arch }}
      run: |
        BINARY_NAME="instant-mc"
        if [ "${{ matrix.os }}" = "windows" ]; then
          BINARY_NAME="${BINARY_NAME}.exe"
        fi

        mkdir -p dist
        go build -ldflags="-s -w -X main.Version=${GITHUB_REF_NAME}" \
          -o "dist/${BINARY_NAME}" ./cmd/instant-mc

        cd dist
        ARCHIVE="instant-mc-${{ matrix.os }}-${{ matrix.arch }}"
        if [ "${{ matrix.os }}" = "windows" ]; then
          zip "${ARCHIVE}.zip" "${BINARY_NAME}"
        else
          tar -czf "${ARCHIVE}.tar.gz" "${BINARY_NAME}"
        fi
        rm "${BINARY_NAME}"
        ls -la

    - name: Upload artifacts
      uses: actions/upload-artifact@v7
      with:
        name: instant-mc-cli-${{ matrix.os }}-${{ matrix.arch }}
        path: |
          dist/*.tar.gz
          dist/*.zip
        retention-days: 30
        if-no-files-found: ignore

  # The GUI needs cgo on Linux and macOS, so it builds on native runners.
  # Windows is the exception: Gio is pure Go there and still cross-compiles.
  build-gui:
    needs: test
    strategy:
      fail-fast: false
      matrix:
        include:
          # Pinned to 22.04 rather than latest: linking against a newer glibc
          # than users have is the classic way to ship a binary that will not
          # start.
          - { runner: ubuntu-22.04, goos: linux, goarch: amd64, cgo: 1 }
          - { runner: ubuntu-22.04, goos: windows, goarch: amd64, cgo: 0 }
          - { runner: macos-14, goos: darwin, goarch: arm64, cgo: 1 }
    runs-on: ${{ matrix.runner }}

    steps:
    - uses: actions/checkout@v7

    - name: Set up Go
      uses: actions/setup-go@v7
      with:
        go-version-file: go.mod

    - name: Install Gio build dependencies
      if: startsWith(matrix.runner, 'ubuntu') && matrix.cgo == 1
      run: |
        # The runner image ships a Google Chrome apt source that breaks
        # apt-get update whenever Google's index is mid-rollover. Nothing
        # here needs it.
        sudo rm -f /etc/apt/sources.list.d/*google* /etc/apt/sources.list.d/*chrome*
        # A third-party index that still fails must not block the Ubuntu
        # packages this actually installs.
        sudo apt-get update || true
        sudo apt-get install -y --no-install-recommends \
          gcc pkg-config libwayland-dev libx11-dev libx11-xcb-dev \
          libxkbcommon-x11-dev libgles2-mesa-dev libegl1-mesa-dev \
          libxcursor-dev libxrandr-dev libxinerama-dev libxi-dev \
          libxxf86vm-dev libvulkan-dev wayland-protocols xorg-dev

    # Windows takes a program's icon from a resource inside the .exe, not
    # from a file beside it, so the icon has to be compiled in. goversioninfo
    # turns packaging/instant-launcher.ico plus the version strings into a
    # .syso, which the Go linker picks up on its own from the main package.
    # -64 is not optional: without it the object is 32-bit COFF and the
    # linker stops at "unknown relocation type 7".
    - name: Compile the Windows icon into a resource
      if: matrix.goos == 'windows'
      run: |
        go run github.com/josephspurrier/goversioninfo/cmd/goversioninfo@v1.4.1 -64 \
          -icon packaging/instant-launcher.ico \
          -o cmd/instant-launcher/resource_windows_amd64.syso \
          packaging/windows/versioninfo.json

    - name: Build binary
      env:
        GOOS: ${{ matrix.goos }}
        GOARCH: ${{ matrix.goarch }}
        CGO_ENABLED: ${{ matrix.cgo }}
      run: |
        BINARY_NAME="instant-launcher"
        # A GUI-subsystem binary, so Windows does not open a console window
        # beside the launcher.
        EXTRA_LDFLAGS=""
        if [ "${{ matrix.goos }}" = "windows" ]; then
          BINARY_NAME="${BINARY_NAME}.exe"
          EXTRA_LDFLAGS="-H windowsgui"
        fi

        mkdir -p dist
        go build -ldflags="-s -w ${EXTRA_LDFLAGS} -X main.Version=${GITHUB_REF_NAME} -X main.defaultMSAClientID=${{ vars.MSA_CLIENT_ID }}" \
          -o "dist/${BINARY_NAME}" ./cmd/instant-launcher

        cd dist
        ARCHIVE="instant-launcher-${{ matrix.goos }}-${{ matrix.goarch }}"
        if [ "${{ matrix.goos }}" = "windows" ]; then
          zip "${ARCHIVE}.zip" "${BINARY_NAME}"
        else
          tar -czf "${ARCHIVE}.tar.gz" "${BINARY_NAME}"
        fi
        rm "${BINARY_NAME}"
        ls -la

    - name: Upload artifacts
      uses: actions/upload-artifact@v7
      with:
        name: instant-launcher-${{ matrix.goos }}-${{ matrix.goarch }}
        path: |
          dist/*.tar.gz
          dist/*.zip
        retention-days: 30
        if-no-files-found: ignore

  release:
    needs: [build-cli, build-gui]
    runs-on: ubuntu-24.04
    if: startsWith(github.ref, 'refs/tags/')
    permissions:
      contents: write
      actions: read

    steps:
    - uses: actions/checkout@v7

    - name: Download all artifacts
      uses: actions/download-artifact@v8
      with:
        path: artifacts

    - name: Prepare release assets
      run: |
        mkdir -p release-assets
        echo "Downloaded artifacts:"
        find artifacts -type f \( -name "*.tar.gz" -o -name "*.zip" \) | sort

        find artifacts -name "*.tar.gz" -exec cp {} release-assets/ \;
        find artifacts -name "*.zip" -exec cp {} release-assets/ \;

        echo "Release assets:"
        ls -la release-assets/

    - name: Create Release
      uses: softprops/action-gh-release@v3
      with:
        files: release-assets/*
        generate_release_notes: true
        draft: false
        prerelease: ${{ contains(github.ref, '-') }}
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  notify:
    needs: [test, build-cli, build-gui, release]
    if: always()
    runs-on: ubuntu-24.04
    steps:
    - name: Notify pipepush
      run: |
        curl -sf -X POST "$PIPEPUSH_SERVER/api/webhook" \
          -H "Content-Type: application/json" \
          -d "{\"token\":\"$PIPEPUSH_TOKEN\",\"status\":\"${{ (contains(needs.*.result, 'failure') || contains(needs.*.result, 'cancelled')) && 'failure' || 'success' }}\",\"pipeline\":\"$GITHUB_WORKFLOW\",\"branch\":\"$GITHUB_REF_NAME\",\"commit\":\"$GITHUB_SHA\",\"runId\":\"$GITHUB_RUN_NUMBER\"}"
      env:
        PIPEPUSH_TOKEN: ${{ secrets.PIPEPUSH_TOKEN }}
        PIPEPUSH_SERVER: ${{ vars.PIPEPUSH_SERVER }}
